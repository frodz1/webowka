#cloud-config
# Wklej jako "Cloud-init script" przy tworzeniu instancji w OCI (Advanced options -> Management).
# PRZED WKLEJENIEM podmień DATABASE_URL i SECRET_KEY poniżej. SECRET_KEY musi być
# identyczny na obu maszynach, inaczej token z app1 nie przejdzie na app2.
package_update: true
packages: [docker.io, docker-compose-v2, git]
runcmd:
  # Obrazy OCI mają własne reguły iptables - bez tego port 80 jest zamknięty NA MASZYNIE,
  # nawet gdy Security List w konsoli go przepuszcza.
  - iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
  - netfilter-persistent save || true
  - systemctl enable --now docker
  - git clone https://github.com/frodz1/webowka.git /opt/questlog
  - |
    cat > /opt/questlog/tools/.env <<'ENV'
    DATABASE_URL=postgresql://USER:HASLO@HOST/questlog?sslmode=require
    SECRET_KEY=PODMIEN-NA-DLUGI-LOSOWY
    ENV
  - docker compose -f /opt/questlog/tools/docker-compose.cloud.yml up -d --build
  - echo "CLOUD-INIT OK" > /var/log/questlog-ready
