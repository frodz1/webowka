name: questlog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questlog}
      POSTGRES_DB: ${POSTGRES_DB:-questlog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../code/backend
    image: ghcr.io/frodz1/questlog-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-questlog}:${POSTGRES_PASSWORD:-questlog}@db:5432/${POSTGRES_DB:-questlog}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

  # Jedyna usługa wystawiona na hosta; Caddy serwuje front i przekazuje /api do backendu.
  frontend:
    build: ../code/frontend
    image: ghcr.io/frodz1/questlog-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /config:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=10001,gid=10001
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

  # Testy backendu: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build: ../code/backend
    entrypoint: ["pytest", "-q"]
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-questlog}:${POSTGRES_PASSWORD:-questlog}@db:5432/questlog_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
