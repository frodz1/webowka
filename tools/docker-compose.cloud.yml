# Wariant cloud: bez lokalnej bazy (DATABASE_URL wskazuje na zarządzanego Postgresa)
# i bez TLS-a (certyfikat stoi na load balancerze).
# Obrazy są budowane i testowane w CI, a stąd tylko pobierane z GHCR (tag = SHA commita,
#   zapisywany przez pipeline w tools/.env jako IMAGE_TAG):
#   docker compose -f docker-compose.cloud.yml pull && docker compose -f docker-compose.cloud.yml up -d
name: questlog

services:
  backend:
    image: ghcr.io/frodz1/questlog-backend:${IMAGE_TAG:?brak IMAGE_TAG w tools/.env (ustawia go pipeline)}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?ustaw DATABASE_URL w tools/.env}
      SECRET_KEY: ${SECRET_KEY:?ten sam na wszystkich instancjach, inaczej tokeny nie przejdą}
      # 2 workery x pula 10 = 20 połączeń na instancję; pilnuj limitu bazy.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  frontend:
    image: ghcr.io/frodz1/questlog-frontend:${IMAGE_TAG:?brak IMAGE_TAG w tools/.env (ustawia go pipeline)}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
