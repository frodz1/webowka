# CI: testy backendu, build frontu i smoke test całego stacku na każdym PR i pushu na main.
# CD: po zielonym CI na main wdrożenie rolling app1 -> app2 przez self-hosted runnery na VM.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          POSTGRES_DB: questlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U questlog"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://questlog:questlog@localhost:5432/questlog_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/docker-compose.yml up -d --build --wait
      - run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/api/health
      - if: failure()
        run: docker compose -f tools/docker-compose.yml logs

  deploy:
    needs: [backend, frontend, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        host: [app1, app2]
      max-parallel: 1   # rolling: jedna instancja naraz, druga obsługuje ruch za LB
      fail-fast: true   # padnie app1 -> app2 zostaje na starej wersji
    runs-on: [self-hosted, "${{ matrix.host }}"]
    environment:
      name: production
      url: https://questlog.com.pl
    concurrency:
      group: deploy-${{ matrix.host }}
      cancel-in-progress: false
    steps:
      # Bez checkout: pracujemy na /opt/questlog, gdzie leży tools/.env (poza gitem).
      - name: Pobierz wersję z main
        run: cd /opt/questlog && git fetch origin main && git reset --hard "$GITHUB_SHA"
      - name: Przebuduj i uruchom kontenery
        run: docker compose -f /opt/questlog/tools/docker-compose.cloud.yml up -d --build
      - name: Health check
        run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost/api/health
      - name: Sprzątanie starych obrazów
        run: docker image prune -f
