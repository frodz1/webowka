# CI: testy backendu, build frontu oraz build i smoke test obrazów na każdym PR i pushu na main.
# Bezpieczeństwo (L6): SAST (Semgrep), sekrety (Gitleaks), SCA (pip-audit, npm audit),
#   skan obrazów (Trivy), DAST (OWASP ZAP), podpis obrazów (cosign). Każdy skan blokuje pipeline.
# Registry: po zielonym smoke test na main te same obrazy trafiają do GHCR (tag = SHA commita) i są podpisywane.
# CD: wdrożenie rolling app1 -> app2 przez self-hosted runnery; maszyny weryfikują podpis, pobierają i uruchamiają obrazy.
# Akcje są przypięte do SHA commita (tag można przestawić, SHA nie).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: questlog
          POSTGRES_PASSWORD: questlog
          POSTGRES_DB: questlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U questlog"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: SCA - znane podatności w zależnościach Pythona (pip-audit)
        run: pip install pip-audit==2.10.* && pip-audit -r requirements.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://questlog:questlog@localhost:5432/questlog_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      # Tylko zależności produkcyjne: narzędzia deweloperskie (vite) nie trafiają do obrazu, który serwuje dist/.
      - name: SCA - znane podatności w zależnościach npm (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Reguły p/default: Python, JS/React, Dockerfile, GitHub Actions. --error = każde znalezisko blokuje.
      - name: SAST (Semgrep)
        run: pipx run semgrep==1.184.0 scan --config p/default --error --metrics=off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # cała historia: sekret usunięty w późniejszym commicie nadal jest wyciekiem
      # --redact: znaleziony sekret nie trafia do publicznych logów Actions.
      - name: Skan sekretów w historii gita (Gitleaks)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner -v

  # Buduje obrazy, skanuje i testuje DOKŁADNIE te obrazy, na main wypycha je do GHCR (tag = SHA commita) i podpisuje.
  # Maszyny w OCI są arm64, więc budujemy natywnie na runnerze arm64 (bez emulacji).
  # Nazwa joba zostaje "smoke": ruleset wymaga checka o tej nazwie.
  smoke:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose -f tools/docker-compose.yml build backend frontend
      # HIGH/CRITICAL z dostępną poprawką blokują pipeline; wyjątki z uzasadnieniem i datą ważności w .trivyignore.
      - name: Skan obrazów (Trivy)
        run: |
          for s in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              -v "$PWD:/repo:ro" -w /repo aquasec/trivy:0.76.2 image --no-progress \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/frodz1/questlog-$s:$IMAGE_TAG"
          done
      - run: docker compose -f tools/docker-compose.yml up -d --no-build --wait
      - run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/api/health
      # Pasywny skan działającej aplikacji. Ostrzeżenia blokują pipeline, poza regułami z tools/zap-rules.tsv.
      - name: DAST (OWASP ZAP baseline)
        run: |
          mkdir -p zap && cp tools/zap-rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:8080 -c zap-rules.tsv -r zap.html
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: zap/zap.html
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f tools/docker-compose.yml logs
      # Wypychamy dopiero po zielonych testach i skanach, tylko z main (PR-y, w tym z forków, niczego nie publikują).
      - name: Wypchnij obrazy do GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose -f tools/docker-compose.yml push backend frontend
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Podpis po digeście (nie po tagu). Klucz prywatny tylko w sekretach repo; publiczny w tools/cosign.pub.
      - name: Podpisz obrazy (cosign)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          : "${COSIGN_PRIVATE_KEY:?brak sekretu COSIGN_PRIVATE_KEY}"
          for s in backend frontend; do
            ref=$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/frodz1/questlog-$s:$IMAGE_TAG")
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          done

  deploy:
    needs: [backend, frontend, sast, secrets, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        host: [app1, app2]
      max-parallel: 1   # rolling: jedna instancja naraz, druga obsługuje ruch za LB
      fail-fast: true   # padnie app1 -> app2 zostaje na starej wersji
    runs-on: [self-hosted, "${{ matrix.host }}"]
    environment:
      name: production
      url: https://questlog.com.pl
    concurrency:
      group: deploy-${{ matrix.host }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read   # pobieranie obrazów z GHCR tokenem joba
    steps:
      # Bez checkout: pracujemy na /opt/questlog (tools/.env jest poza gitem).
      # Z repo potrzebne są tylko plik compose i klucz publiczny cosign; obrazów nie budujemy na maszynie.
      - name: Pobierz wersję z main
        run: cd /opt/questlog && git fetch origin main && git reset --hard "$GITHUB_SHA"
      # Konfiguracja trafia do tools/.env (prawa 600): sekrety z environmentu production
      # oraz IMAGE_TAG (SHA commita). Podmieniamy tylko te klucze; resztę (np. WEB_CONCURRENCY) zostawiamy.
      - name: Zapisz konfigurację do tools/.env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${DATABASE_URL:?brak sekretu DATABASE_URL}" "${SECRET_KEY:?brak sekretu SECRET_KEY}"
          case "$DATABASE_URL$SECRET_KEY" in *\'*) echo "sekret zawiera apostrof"; exit 1;; esac
          umask 077
          f=/opt/questlog/tools/.env
          { grep -vE '^(DATABASE_URL|SECRET_KEY|IMAGE_TAG)=' "$f" || true
            printf "DATABASE_URL='%s'\nSECRET_KEY='%s'\nIMAGE_TAG=%s\n" "$DATABASE_URL" "$SECRET_KEY" "$IMAGE_TAG"
          } > "$f.new"
          mv "$f.new" "$f"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Niepodpisany (lub podpisany innym kluczem) obraz nie zostanie uruchomiony.
      - name: Zweryfikuj podpisy, pobierz obrazy z GHCR i uruchom kontenery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /opt/questlog/tools
          trap 'docker logout ghcr.io' EXIT
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for s in backend frontend; do
            cosign verify --key cosign.pub "ghcr.io/frodz1/questlog-$s:$GITHUB_SHA" > /dev/null
          done
          docker compose -f docker-compose.cloud.yml pull
          docker compose -f docker-compose.cloud.yml up -d
      - name: Health check
        run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost/api/health
      # Obrazy mają tagi SHA, więc stare nie są "dangling": usuwamy nieużywane starsze niż doba.
      - name: Sprzątanie starych obrazów
        run: docker image prune -af --filter "until=24h"
